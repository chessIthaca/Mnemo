# Cargo configuration for Mnemo.
#
# Linker: use rust-lld (the LLVM lld linker shipped in the Rust toolchain)
# for the Windows MSVC target. The default MSVC `link.exe` is dramatically
# slower for large binaries like the Tauri app (~60s link → ~10-15s with lld).
# rust-lld.exe lives in the toolchain under
# lib/rustlib/x86_64-pc-windows-msvc/bin/, so no PATH setup is needed — cargo
# resolves it from the active toolchain. Gated to the MSVC target so macOS
# builds (which use the system linker) are unaffected.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# Temp folders: every temp folder a cargo-launched process (tests, build
# scripts, the children they spawn) creates stays inside this checkout's own
# target folder instead of the user's system temp folder. `tempfile`'s TempDir
# and every `std::env::temp_dir()` caller read TMP (Windows) or TMPDIR (Unix),
# so the ~2,600 `TempDir::new()`/`tempdir()` call sites follow without edits.
#
# The value is `target`, not `target/tmp`: cargo creates `target/tmp`
# (CARGO_TARGET_TMPDIR) only while it builds or runs an integration-test or
# bench target, so a unit-test binary — `cargo test --lib`, and a warm
# `cargo test --workspace`, which runs the unit tests first — would see TMP
# pointing at a folder that does not exist yet and every `tempdir()` would fail
# with NotFound. Cargo always has `target` in place before it starts a test or
# `cargo run` process, and `cargo clean` and the Mnemo2 pool trim remove it with
# the checkout; the temporary `.tmpXXXXXX` folders sit beside `debug/` and
# `release/`.
#
# `relative = true` resolves the value against the folder holding this
# `.cargo` directory, so each worker/pool checkout uses its own
# <checkout>/target. `force = true` is required on Windows: TMP and TEMP are
# always set in the environment, and a non-forced entry is then ignored.
# `[env]` only reaches processes cargo launches, so installed/release builds
# are unaffected.
#
# `GIT_CEILING_DIRECTORIES` keeps that move invisible to Git's repository
# discovery: a temp folder directly under `target` would otherwise sit inside
# this checkout's worktree, so `git` run in such a folder would find the
# checkout's own `.git` and tests that need "not a repository" (or park a
# fixture's `.git` away) would see a repository anyway. The ceiling is the
# `target` folder, so the walk stops before the checkout while a real
# repository created inside a temp folder is still found.
[env]
TMP = { value = "target", relative = true, force = true }
TEMP = { value = "target", relative = true, force = true }
TMPDIR = { value = "target", relative = true, force = true }
GIT_CEILING_DIRECTORIES = { value = "target", relative = true, force = true }
