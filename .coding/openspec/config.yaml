# OpenSpec project configuration — loaded by src/app/openspec/schema.rs
# (a missing file is the empty configuration; malformed YAML is an error).
#
# governed_files maps a capability to the source files whose changes affect
# its specified behavior. plan_create refuses a plan whose steps touch a
# governed file without a spec delta for that capability, unless the plan
# carries an explicit spec_impact "none" declaration with a reason — the
# same refusal-with-guidance pattern as the memory-search gate.
governed_files:
  dispatch-routing:
    - src-tauri/src/mnemo2/team.rs
    - src-tauri/src/mnemo2/dispatch_routing.rs
    - src-tauri/src/mnemo2/route_eval.rs
    - src-tauri/src/mnemo2/laya_settings.rs
    - src-tauri/src/ipc/finetune.rs
    - src-tauri/src/bin/mnemo2_route_eval.rs
    - src/agent/route_question.rs
    - src/agent/route_knn.rs
    - src/agent/model_routing.rs
    - src/agent/failure_triage.rs
    - src/agent/failure_triage_knn.rs
  # external-lead — .coding/openspec/specs/external-lead/spec.md:
  #   "Tool calls attach the external lead" / "A closing helper keeps the
  #   lead while another helper led" / "Idle external leads are released" —
  #   the attach, detach, remembered-helper and idle-sweep endpoints in
  #   src-tauri/src/mnemo2/mcp_server.rs drive the external-lead state
  #   (TeamRuntime::ExternalLead) in src-tauri/src/mnemo2/team.rs.
  external-lead:
    - src-tauri/src/mnemo2/mcp_server.rs
    - src-tauri/src/mnemo2/team.rs
  # tier-ladder — .coding/openspec/specs/tier-ladder/spec.md:
  #   "Five fixed tiers" (escalate never offered to Laya/kNN; team_dispatch
  #   refuses it for fresh work — src-tauri/src/mnemo2/team.rs),
  #   "Empty tiers fold down" and "Retired tier ids" (TIER_IDS, escalation,
  #   convert_old_id — src/config/endpoints.rs), "Serialized configuration
  #   writes" (the config.write.lock — src/config/mod.rs), "One Tiers page"
  #   (mnemo2/src/components/TiersPage.svelte).
  tier-ladder:
    - src/config/endpoints.rs
    - src/config/mod.rs
    - src-tauri/src/mnemo2/team.rs
    - mnemo2/src/components/TiersPage.svelte
  # worker-brief — .coding/openspec/specs/worker-brief/spec.md:
  #   "Workers get the whole plan at dispatch" — PlanBoard::brief_for in
  #   src/app/plan_board.rs, assembled into the dispatch header in
  #   src-tauri/src/mnemo2/team.rs; "Workers can re-read their plan" — the
  #   plan_read host tool in src-tauri/src/mnemo2/team.rs over
  #   PlanBoard::worker_view; "Working workers hear about plan changes" —
  #   the edit observer in src/app/plan_board.rs, delivered as worker
  #   notices in src-tauri/src/mnemo2/team.rs.
  worker-brief:
    - src/app/plan_board.rs
    - src-tauri/src/mnemo2/team.rs
  # plan-board — born with plan a707e9fa's spec delta (the spec-impact gate
  # requirement): the plan board and its plan_create/plan_update tools.
  plan-board:
    - src/app/plan_board.rs
    - src/app/tool/workflow/board.rs
