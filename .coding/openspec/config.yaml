  # tier-ladder — .coding/openspec/specs/tier-ladder/spec.md:
  #   "Five fixed tiers" (escalate never offered to Laya/kNN; team_dispatch
  #   refuses it for fresh work — src-tauri/src/mnemo2/team/dispatch.rs and
  #   team/routing.rs),
  #   "Empty tiers fold down" and "Retired tier ids" (TIER_IDS, escalation,
  #   convert_old_id — src/config/endpoints.rs), "Serialized configuration
  #   writes" (the config.write.lock — src/config/mod.rs), "One Tiers page"
  #   (mnemo2/src/components/TiersPage.svelte).
  tier-ladder:
