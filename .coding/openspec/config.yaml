  # worker-brief — .coding/openspec/specs/worker-brief/spec.md:
  #   "Workers get the whole plan at dispatch" — PlanBoard::brief_for in
  #   src/app/plan_board.rs, assembled into the dispatch header in
  #   src-tauri/src/mnemo2/team/dispatch.rs; "Workers can re-read their
  #   plan" — the plan_read host tool in src-tauri/src/mnemo2/team/pump.rs
  #   over PlanBoard::worker_view; "Working workers hear about plan
  #   changes" — the edit observer in src/app/plan_board.rs, delivered as
  #   worker notices in src-tauri/src/mnemo2/team.rs and team/control.rs.
  worker-brief:
    - src/app/plan_board.rs
    - src-tauri/src/mnemo2/team.rs
    - src-tauri/src/mnemo2/team/record.rs
    - src-tauri/src/mnemo2/team/persistence.rs
