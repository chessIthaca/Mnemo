[[rule]]
tool = "shell"
pattern = '^shell:Get\-ChildItem \.coding\\reviews\\ \-Filter "\*stats\-model\*" \| Select\-Object \-ExpandProperty Name; if \(\-not \(Test\-Path \.coding\\reviews\\\*stats\-model\*\)\) \{ Get\-ChildItem \.coding\\reviews\\ \| Sort\-Object LastWriteTime \-Descending \| Select\-Object \-First 2 \-ExpandProperty Name \}$'

