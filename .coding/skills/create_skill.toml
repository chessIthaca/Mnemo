# The create_skill skill — plan-free skill authoring.
#
# Entered via skill_start("create_skill") from Complete or Planning — NO plan
# needed, which is the point: authoring a skill is a `.coding/` side-car chore,
# not plan-scale work. It replaces the path that needed a plan around it (e.g.
# plan 7ef0eb71, which authored post_merge_sync from Executing).
#
# Why an overlay instead of always-available skill_create: the base-state rule
# stays "Executing-only", and a skill grants it only by NAMING it in its
# allow-list — an explicit, file-based, reviewable entry, the same shape as
# merge_to_main granting `git`/`file_edit` from Complete. The always-available
# set was rejected as the grant path: it would re-open an implicit authoring
# back door in every state (memory 296b3c9c, the 2026 user requirement). See
# the `skill_create` guard in src/tool/mod.rs `allows` + its test
# `skill_create_is_executing_only_unless_a_skill_names_it`.
#
# The prompt below is injected into the system prompt EVERY turn the skill runs,
# so it stays a terse checklist. Rationale lives here in comments (never
# injected) — do not move it into the prompt; each rule encodes a real failure:
# - LIVE tool names only. `file_read`/`file_append` are legacy redirect shims
#   (src/agent/approval.rs: "folded into read_files / file_write"): the model
#   calls `read_files`/`file_write`, so a shim entry in an allow-list is
#   SILENTLY USELESS. That exact trap denied `read_files` inside merge_to_main
#   (backlog 834ec126) and is why this overlay lists `read_files`.
# - Nesting is impossible: skill_start is not available while a skill is
#   active, so a smoke test must EXIT first (skill_end) and re-enter.
# - A repo skill ships with its pinning test (src/skill/mod.rs, the
#   CARGO_MANIFEST_DIR repo-TOML tests) + docs — that is what keeps the flow it
#   documents from silently rotting; a `skill_create` call alone is not enough.

name = "create_skill"
available_in = ["complete", "planning"]
target_state = "planning"
tools = [
  "read_files",
  "search",
  "file_edit",
  "skill_create",
  "shell",
  "git",
  "skill_end",
  "abandon_skill",
]
prompt = """\
Author or revise a skill WITHOUT a plan. Steps:
1. Author with the `skill_create` tool — it validates, writes `.coding/skills/<name>.toml` and hot-registers it (never hand-write the TOML with the file tools; never restart the app): `name` lowercase letters/digits/`_`/`-` matching the filename; `available_in`/`target_state` ∈ planning|executing|complete; `tools` = LIVE registry names (`read_files`, `file_write`, `file_edit`, `multi_edit`, `shell`, `git`, ...) — NEVER the legacy shims `file_read`/`file_append` (silently useless: the model calls `read_files`); do not list memory tools, `ask_user`, `current_plan`, `skill_reload` or the exits (always available), and `write_review_report` is refused. `prompt` = terse injected checklist; the rationale goes in the TOML header comment (never injected). Revising (`overwrite: true`) → refresh its header comment and its pinned test too. App-shipped skills are refused — edit those with the approval-gated file tools.
2. Validate: read the file back (`read_files`), confirm every allow-list name is a live tool, then `skill_reload` — the output must report the skill added/unchanged, never skipped (a malformed TOML is logged and dropped at load).
3. Smoke it: `skill_end` first (no nesting), then `skill_start` with the skill's name, run its surface once, `skill_end`.
4. Repo skill (this project's `.coding/skills/`): pin the prompt in `src/skill/mod.rs` (CARGO_MANIFEST_DIR repo-TOML tests: the load + the load-bearing prompt anchors), update `docs/FEATURES.md` when the flow narrative changed, run `cargo test`, and commit on the current `wt/*` branch with the `git` tool (approval-gated). NEVER commit to main — landing stays with merge_to_main.
5. Report the path, allow-list, smoke result, test result; `skill_end` → Planning. Stuck, or it turns out to need app code → `abandon_skill`, then a plan.\
"""
