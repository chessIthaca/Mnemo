# The new_release skill — cut a versioned GitHub release of Mnemo.
#
# Entered via skill_start("new_release") (Complete/Planning only). The build
# workflow's `release` job (landed with the v0.1.1 release plan) creates the
# GitHub release with the installers when a v* tag is pushed — this skill
# prepares the tree and pushes the tag; it never creates the release itself.
#
# The prompt below is injected into the system prompt EVERY turn the skill
# runs, so it stays a terse checklist. The rationale for its hard rules
# lives here in comments (never injected) — do not move it into the prompt:
# - ALL FIVE manifest files + the About-dialog fallback literal move together
#   (step 1): src-tauri/tauri.conf.json is what the installers report; the
#   Cargo.toml/package.json versions keep cargo and npm in sync. A half-bumped
#   tree ships installers whose version disagrees with the tag.
# - The tag points at MERGED main, never a branch tip (step 3): the release
#   job checks out the tag — a branch-tip tag would build code that never
#   landed on main.
# - NEVER create the release manually (step 4): the workflow's release job
#   owns release creation on v* tags. A manual asset-less release on the
#   same tag blocks the CI one (published releases are immutable).
# - The tag push is the one irreversible action (approval-gated; it triggers
#   the ~30-90 min dual-runner build) — everything before it is fixable.
# - The API check (step 4) reads the public repo REST API unauthenticated;
#   no gh auth is needed.
# - Ruleset-aware landing (2026-09-21): ruleset 23755694 ("Protect from direct
#   pushing.") blocks direct pushes to main (GH013), so step 2 detects it
#   (gh api repos/<owner>/<repo>/rulesets — an ACTIVE ruleset with a
#   pull_request rule) and opens a PR instead — the human approves and merges,
#   then the skill is re-run to tag (on re-run main already carries the bump).
#   The TAG push (step 3) is NOT blocked: the ruleset's conditions target
#   ~DEFAULT_BRANCH only — refs/tags/v* sit outside it (verified 2027-01-11
#   via gh api .../rulesets/23755694).
# - Landing records are written BEFORE the commit (2026-09-26, from
#   merge_to_main's ordering defect): a memory/knowledge write issued after the
#   push can never land — protected main rejects it and the branch that could
#   have carried it is gone — so the records go into the branch's own commit
#   and never name their own merge sha (a commit cannot contain its own hash).

name = "new_release"
available_in = ["complete", "planning"]
target_state = "planning"
tools = [
  "file_read",
  "file_edit",
  "shell",
  "git",
  "skill_end",
  "abandon_skill",
]
prompt = """\
Cut a new versioned release of Mnemo. The build workflow's release job creates the GitHub release (Windows .msi/.exe + macOS .dmg/mnemo.app.zip assets, + generated notes) when a v* tag is pushed — this skill prepares the tree and pushes the tag; it NEVER creates the release itself. Steps:
1. Bump the version in ALL FIVE manifest files together — src-tauri/tauri.conf.json, package.json, frontend/package.json, Cargo.toml, src-tauri/Cargo.toml — plus the About-dialog fallback literal in frontend/src/components/about/AboutDialog.tsx (patch bump, or the version named in the request; if already bumped, continue). Then `npm install --package-lock-only` to refresh package-lock.json and `cargo check` to refresh Cargo.lock, and commit everything on the working branch.
2. Land it on main: FIRST `Write this branch's landing records NOW`, before anything is committed — memory_supersede this branch's stale status records (skip when nothing matches, never another branch's records) with the title tail `— MERGED into main (branch <branch>, <YYYY-MM-DD>)` and a body naming the branch and its WORK TIP (`git rev-parse HEAD` captured BEFORE this commit); never record a merge sha or a PR number — neither exists before the branch is frozen (a commit cannot contain its own hash; the PR number comes from `gh pr create`, i.e. after the push); on the PR path add `a PR against main is opened from this branch, awaiting human review`. THEN `commit ALL uncommitted work (.coding/ included)` — that commit carries the records into the merge. Ruleset check via shell (`gh api repos/<owner>/<repo>/rulesets` — an ACTIVE ruleset with a `pull_request` rule blocks direct pushes to main, GH013): none → `git checkout main`, sync via shell (`git fetch origin`, `git pull --no-rebase`), merge --no-ff on the git tool — any conflict, in the pull or the merge: file_edit taking the UNION of both sides, `git add` + `git commit`; never drop a side, never `-X ours`/`-X theirs` — then verify BOTH builds (`npm run build` in frontend/ AND `cd src-tauri && cargo build`), push, then `git branch -d`. Ruleset present → verify the BRANCH builds first (`npm run build` in frontend/ AND `cd src-tauri && cargo build`; PRs get no CI), then push the branch (`git push -u origin <branch>` on the git tool), `gh pr create --base main --head <branch> --title "Release v<version>" --body "<git log main..<branch> --oneline> + review verdicts + build status"`, report the PR URL and STOP — re-run this skill after the human approves and merges (the bump must be on main before tagging; on re-run: `git checkout main`, sync via shell (`git fetch origin`, `git pull --no-rebase`) — main already carries the bump → continue to step 3; the tag push itself is NOT blocked — tag refs sit outside the branch-targeting ruleset). No memory or knowledge write after the landing: the records are already in the commit above and a post-landing write can never land — check `git status --short` is clean before `skill_end`.
3. Tag the MERGED main commit (never a branch tip): `git tag -a v<version> -m "Mnemo v<version>"`, then push the tag via shell `git push origin v<version>` (approval-gated — triggers the ~30-90 min dual-runner build).
4. Verify the run started: shell `Invoke-RestMethod https://api.github.com/repos/chessIthaca/Mnemo/actions/runs?event=push` — confirm a run for the tag is queued/in_progress. Do NOT create the release manually; it appears when the run completes.
5. Report the run URL + the expected release URL (https://github.com/chessIthaca/Mnemo/releases/tag/v<version>); `skill_end` → Planning.\
"""
