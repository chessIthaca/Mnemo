# CodeQL configuration for the advanced-setup workflow
# (.github/workflows/codeql.yml).
#
# `vendor/` is excluded from RESULTS (extraction still runs, which is what the
# Rust no-build extractor needs). vendor/wry is a pruned
# third-party mirror regenerated from its PATCHES.md, so findings there are
# not actionable in this repository: the only three results the Rust analysis
# ever reported were `rust/insecure-cookie` in vendor/wry, dismissed as false
# positives on 2026-09-29 (.coding/analysis/2026-09-29-github-security-defects.md).
# Report anything real upstream to wry instead.
paths-ignore:
  - vendor/**
