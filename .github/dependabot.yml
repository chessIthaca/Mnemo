# Dependabot version updates.
#
# Security alerts are already enabled repository-wide (and security-update PRs
# are automatic); this file only governs the SCHEDULED version-update PRs.
# Weekly and grouped on purpose: this repo's CI is expensive (Windows + macOS
# Tauri builds, ~25 min each), so ungrouped daily PRs would burn runner minutes
# on patch bumps nobody reviews.
version: 2
updates:
  # Rust. The root Cargo.lock covers the whole workspace
  # (members = ["src-tauri"]), so one entry is enough.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # tao/wry are [patch.crates-io] path overrides onto vendor/ (root
      # Cargo.toml): the app deliberately runs patched 0.35.4 / 0.55.3 builds,
      # so a registry bump would drop the backported fixes and fight the pins.
      - dependency-name: tao
      - dependency-name: wry
      # Reviewing any cargo PR from this group: confirm the Cargo.lock diff
      # contains NO `[[patch.unused]]` entries. Bumping tauri past 2.11.6 (or
      # tauri-runtime-wry past 2.11.4) moves wry to 0.57 and tao to 0.37, which
      # turns both patches into `[[patch.unused]]` entries and silently ships
      # the registry crates instead of the vendored ones — that is why #26 was
      # closed and replaced by the hand-rolled #32. tauri and tauri-runtime-wry
      # are therefore ignored here too — bump them by hand together with the
      # vendor/ patches and re-check the lock for `[[patch.unused]]`.
      - dependency-name: tauri
      - dependency-name: tauri-runtime-wry
  # npm. The workspace lockfile lives at the root (workspaces = ["frontend"]).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  # The workflows pin actions to full commit SHAs (each with a `# vN` comment;
  # guarded by tests/integration/ci_workflow.rs): this surfaces the next action
  # release as a reviewable PR instead of a runner warning.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
