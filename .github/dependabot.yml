# Dependabot version updates.
#
# Security alerts are already enabled repository-wide (and security-update PRs
# are automatic); this file only governs the SCHEDULED version-update PRs.
# Weekly and grouped on purpose: this repo's CI is expensive (Windows + macOS
# Tauri builds, ~25 min each), so ungrouped daily PRs would burn runner minutes
# on patch bumps nobody reviews.
version: 2
updates:
  # Rust. The root Cargo.lock covers the whole workspace
  # (members = ["src-tauri"]), so one entry is enough.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # wry is a [patch.crates-io] path override onto vendor/ (root
      # Cargo.toml): the app deliberately runs a patched 0.57.2 build (WebView2
      # OS-account SSO + hard reload), so a registry bump would drop those
      # fixes and fight the pin.
      - dependency-name: wry
      # Reviewing any cargo PR from this group: confirm the Cargo.lock diff
      # contains NO `[[patch.unused]]` entries and keeps wry path-sourced.
      # Bumping tauri past 2.12.0 (or tauri-runtime-wry past 2.12.0) moves wry
      # off ^0.57, which turns the patch into a `[[patch.unused]]` entry and
      # silently ships the registry crate instead of the vendored one — that is
      # why #26 was closed and replaced by the hand-rolled #32. tauri and
      # tauri-runtime-wry are therefore ignored here too — bump them by hand
      # together with the vendor/wry patches and re-check the lock for
      # `[[patch.unused]]`. (tao is no longer vendored or ignored: tauri 2.12
      # resolves tao 0.37.x, which carries the PR #1215 keyboard/IME deadlock
      # fix natively.)
      # Machine-guarded since 2027-01-11: the integration guard
      # `cargo_lock_keeps_the_vendored_patches` fails the build when a
      # `[[patch.unused]]` entry appears or wry stops being path-sourced
      # (`tests/integration/ci_workflow.rs`).
      - dependency-name: tauri
      - dependency-name: tauri-runtime-wry
  # npm. The workspace lockfile lives at the root (workspaces = ["frontend"]).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  # The workflows pin actions to full commit SHAs (each with a `# vN` comment;
  # guarded by tests/integration/ci_workflow.rs): this surfaces the next action
  # release as a reviewable PR instead of a runner warning.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
