# CodeQL advanced setup — replaces the repository's CodeQL default setup.
#
# Why advanced setup: default setup analyses every path, so the vendored
# third-party mirrors under `vendor/` (pruned tao/wry sources regenerated from
# their PATCHES.md) kept producing `rust/insecure-cookie` findings that are
# false positives for this repository — the only three results the Rust
# analysis ever reported were all in vendor/wry, dismissed on 2026-09-29
# (.coding/analysis/2026-09-29-github-security-defects.md). Default setup has no
# path filters; the codeql-config file this workflow points at does.
#
# Actions are pinned to full commit SHAs (version in the trailing comment, so
# Dependabot can keep them current) — the one exception is
# dtolnay/rust-toolchain, which reads its own ref to select the toolchain and
# publishes no version tags, so it stays `@stable` (see the
# workflows_pin_actions_to_full_shas regression test).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly (Monday 04:17 UTC) — the cadence the default setup used.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# One analysis set per ref: a superseded push cancels the in-flight run.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The languages the default setup covered. Every one of them is
        # extracted without a build (Rust support is no-build-only), so no
        # autobuild step is needed — which also keeps the GTK-only tauri deps
        # (never built for this app's Windows/macOS targets) out of the picture.
        language: [actions, javascript-typescript, python, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
