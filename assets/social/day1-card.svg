<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="d1-title d1-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d1-title">Mnemo — an agentic coding harness that remembers</title>
  <desc id="d1-desc">Launch card. Headline: "Stop paying flagship prices for an agent that forgets." Below it a strip shows the allocation: a sharp model plans, a cheap model executes, a read-only reviewer audits. Two supporting lines name the four-tier memory, the 12-language tree-sitter code graph, seven token levers on by default, no edits without a plan, git push always gated, and credential redaction in compressed output. Footer: github.com/chessIthaca/Mnemo — Rust + Tauri, Windows + macOS, MIT.</desc>

  <defs>
    <pattern id="d1-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0f172a" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="d1-wash" cx="0.88" cy="0.10" r="0.72">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <marker id="d1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- paper + texture -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#d1-grid)"/>
  <rect width="1200" height="630" fill="url(#d1-wash)"/>

  <!-- faint off-canvas arcs: composition, not content -->
  <g fill="none" stroke="#0891b2">
    <circle cx="1250" cy="500" r="520" stroke-width="2" stroke-opacity="0.11"/>
    <circle cx="1250" cy="500" r="372" stroke-width="1.5" stroke-opacity="0.07"/>
  </g>

  <!-- masthead -->
  <text x="72" y="86" font-size="31" font-weight="800" fill="#0f172a" letter-spacing="-0.7">Mnemo</text>
  <text x="1128" y="86" text-anchor="end" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.8">OPEN SOURCE · MIT</text>

  <!-- eyebrow -->
  <rect x="72" y="124" width="66" height="6" rx="3" fill="#0891b2"/>

  <!-- hero headline -->
  <g font-size="64" font-weight="800" letter-spacing="-2">
    <text x="72" y="194" fill="#0f172a">Stop paying</text>
    <text x="72" y="268" fill="#0891b2">flagship prices</text>
    <text x="72" y="342" fill="#0f172a">for an agent that forgets.</text>
  </g>

  <!-- the mechanism: one calm strip carrying the whole story -->
  <rect x="72" y="380" width="1056" height="80" rx="18" fill="#f1f5f9"/>
  <g font-size="21">
    <text x="211" y="427" fill="#475569">Sharp model <tspan font-weight="800" fill="#0f172a">plans</tspan></text>
    <text x="445" y="427" fill="#475569">Cheap model <tspan font-weight="800" fill="#0f172a">executes</tspan></text>
    <text x="712" y="427" fill="#475569">Read-only reviewer <tspan font-weight="800" fill="#0f172a">audits</tspan></text>
  </g>
  <g stroke="#0891b2" stroke-width="2.2" fill="none">
    <line x1="400" y1="420" x2="433" y2="420" marker-end="url(#d1-arrow)"/>
    <line x1="672" y1="420" x2="705" y2="420" marker-end="url(#d1-arrow)"/>
  </g>

  <!-- supporting claims, demoted to muted lines -->
  <g font-size="17" fill="#64748b">
    <text x="72" y="512">Remembers across sessions · a 12-language code graph · seven token levers, on by default</text>
    <text x="72" y="546">No edits without a plan · git push always gated · credentials redacted in compressed output</text>
  </g>

  <!-- footer -->
  <text x="72" y="588" font-size="17" font-weight="700" fill="#0891b2">github.com/chessIthaca/Mnemo</text>
  <text x="1128" y="588" text-anchor="end" font-size="15" fill="#94a3b8">Rust + Tauri · Windows + macOS · MIT</text>
</svg>
