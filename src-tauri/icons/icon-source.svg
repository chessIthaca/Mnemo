<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#171B23"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#587CFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#587CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <!-- App icon background -->
  <rect width="1024" height="1024" rx="190" fill="url(#bg)"/>
  <circle cx="730" cy="730" r="230" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Mnemo graph/M mark -->
  <g fill="none" stroke="#E6E7EB" stroke-width="42"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 700V300"/>
    <path d="M210 300L512 540L814 300"/>
    <path d="M814 300V700"/>
  </g>

  <!-- Nodes -->
  <g fill="#E6E7EB">
    <circle cx="210" cy="300" r="54"/>
    <circle cx="512" cy="540" r="54"/>
    <circle cx="814" cy="300" r="54"/>
    <circle cx="210" cy="700" r="54"/>
  </g>

  <!-- Active memory node -->
  <circle cx="814" cy="700" r="125" fill="url(#glow)"/>
  <circle cx="814" cy="700" r="57" fill="#587CFF"/>
  <circle cx="814" cy="700" r="38" fill="#6D8BFF"/>
</svg>