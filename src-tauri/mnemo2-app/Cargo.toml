[package]
name = "mnemo2-app"
version = "2.10.0"
edition = "2021"
description = "The Mnemo2 desktop app (lead + team)"
license = "MIT"
default-run = "mnemo2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mnemo-app = { path = "..", features = ["mnemo2"] }
mnemo = { path = "../..", features = ["browser", "embeddings", "remote"] }
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1.0"
uuid = { version = "1", features = ["v4"] }

# `mnemo2-node` copies its stderr into <home>/node.log by swapping the
# process's stderr handle (src/node/logfile.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[features]
custom-protocol = ["mnemo-app/custom-protocol"]
# Installed Mnemo2 builds update themselves (mnemo-app's `auto-update`);
# build.yml passes it on every release build, a source build leaves it off.
auto-update = ["mnemo-app/auto-update"]

[[bin]]
name = "mnemo2"
path = "src/main.rs"

# The stdio helper the "mnemo" Claude Code plugin runs: a console binary that
# bridges MCP to a running Mnemo2 (or starts one) and answers the plugin hooks.
[[bin]]
name = "mnemo2-mcp"
path = "src/mnemo2_mcp.rs"

# The machine-wide shared embedding-model host (plan d3336a8a step 2): a
# detached console binary every Mnemo2 instance embeds through when one is
# running (loopback HTTP, bearer-token auth, idle exit when no instance
# leases it). `npm run rebuild:mnemo2` installs it to <config>/bin via
# scripts/install-mnemo2-mcp.mjs — the same packaging as mnemo2-mcp.
[[bin]]
name = "mnemo-models"
path = "src/mnemo_models.rs"

# The headless worker node of a remote hub (plan a040713f, phase 2 step 6): a
# console binary (never the GUI `mnemo2`) that pairs once with a hub, dials it,
# and runs worker sessions whose model calls and memory the hub serves.
[[bin]]
name = "mnemo2-node"
path = "src/bin/mnemo2-node.rs"

[[example]]
name = "mnemo2_route_eval"
path = "examples/mnemo2_route_eval.rs"

[[example]]
name = "mnemo2_memory_eval"
path = "examples/mnemo2_memory_eval.rs"

[dev-dependencies]
tempfile = "3"
# The two-process node test (tests/node_e2e.rs) scripts the hub's model.
futures = "0.3"
async-trait = "0.1"
